<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D3B66" />
      <stop offset="50%" stop-color="#1261A0" />
      <stop offset="85%" stop-color="#2E9B5B" />
      <stop offset="100%" stop-color="#40C075" />
    </linearGradient>
    
    <linearGradient id="cityGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0B2B48" />
      <stop offset="100%" stop-color="#1E75BB" />
    </linearGradient>
  </defs>

  <!-- 360 Outer Arrow Ring -->
  <path d="M 250 40 A 190 190 0 1 1 110 380" fill="none" stroke="url(#ringGrad)" stroke-width="24" stroke-linecap="round" />
  <!-- Arrow Head top -->
  <polygon points="250,15 285,45 235,55" fill="#40C075" />

  <!-- Inner City Skyline Silhouette -->
  <!-- Buildings -->
  <rect x="155" y="220" width="22" height="120" fill="url(#cityGrad)" rx="2"/>
  <rect x="180" y="180" width="30" height="160" fill="url(#cityGrad)" rx="2"/>
  <rect x="200" y="200" width="18" height="140" fill="#1261A0" rx="1"/>
  <!-- Central Spire Tower -->
  <rect x="245" y="130" width="10" height="210" fill="#0D3B66"/>
  <polygon points="250,90 245,130 255,130" fill="#0D3B66"/>
  <ellipse cx="250" cy="160" rx="14" ry="7" fill="#1261A0" />

  <rect x="260" y="170" width="32" height="170" fill="url(#cityGrad)" rx="2"/>
  <rect x="295" y="195" width="28" height="145" fill="#1261A0" rx="2"/>
  <rect x="325" y="230" width="20" height="110" fill="url(#cityGrad)" rx="2"/>

  <!-- Building Windows -->
  <circle cx="195" cy="200" r="2.5" fill="#64D8CB"/>
  <circle cx="195" cy="215" r="2.5" fill="#64D8CB"/>
  <circle cx="195" cy="230" r="2.5" fill="#64D8CB"/>

  <circle cx="275" cy="190" r="2.5" fill="#64D8CB"/>
  <circle cx="275" cy="205" r="2.5" fill="#64D8CB"/>
  <circle cx="275" cy="220" r="2.5" fill="#64D8CB"/>
  
  <circle cx="310" cy="215" r="2.5" fill="#64D8CB"/>
  <circle cx="310" cy="230" r="2.5" fill="#64D8CB"/>

  <!-- Green Trees at Base -->
  <circle cx="185" cy="330" r="14" fill="#2E9B5B" />
  <circle cx="315" cy="330" r="14" fill="#2E9B5B" />
  <circle cx="330" cy="335" r="11" fill="#40C075" />

  <!-- Base Curved Swoosh -->
  <path d="M 120 340 Q 250 395 380 340 Q 250 365 120 340 Z" fill="#0D3B66" />
</svg>
